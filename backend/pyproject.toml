# --- Pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-m 'not slow'"
markers = [
    "slow: long-running integration tests (db migration + worktree)",
]
testpaths = ["tests"]
