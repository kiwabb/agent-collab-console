[project]
name = "agent-collab-backend"
version = "0.0.0"
description = "agent-collab-console backend (FastAPI + aiosqlite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.23.0",
    "websockets>=12.0",
    "aiosqlite>=0.19.0",
    "json-repair>=0.30.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".venv314", "build", "dist", "__pycache__"]

[tool.ruff.lint]
# Phase 1: enable the standard set; broaden in Phase 5.
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade,
# B: flake8-bugbear, SIM: flake8-simplify, RUF: ruff-specific.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI patterns)
    "RUF012",  # mutable class attributes annotated with ClassVar (Pydantic)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "B011"]
"app/adapters/sqlite_store.py" = ["E402", "F401"]  # legacy layer-internal
"app/main.py" = ["E402"]  # bootstrap ordering

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Mypy ---
[tool.mypy]
python_version = "3.12"
mypy_path = "app"
# Phase 1: gate opens at a tractable baseline. Phase 2 turns the dial up
# file-by-file as the surface tightens. The Phase 5 burn-down reaches
# strict = true with zero overrides / zero # type: ignore.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = true
check_untyped_defs = false
ignore_missing_imports = true
warn_return_any = true

# Files that are part of the Phase 1 mypy baseline (frozen in current
# shape; Phase 2/5 progressively tighten). A new file added under app/
# MUST pass `disallow_untyped_defs` immediately — this override only
# relaxes the pre-existing 94-module surface.
[[tool.mypy.overrides]]
module = "app.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

# --- Pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-m 'not slow'"
markers = [
    "slow: long-running integration tests (db migration + worktree)",
]
testpaths = ["tests"]
