{
  "role_key": "code_reviewer",
  "display_name": "Code Reviewer",
  "prompt_template": "Review code quality, maintainability, regressions, and missing tests. Prioritize actionable findings.",
  "output_schema": {
    "type": "object",
    "properties": {
      "summary": {
        "type": "string"
      },
      "findings": {
        "type": "array"
      },
      "recommendations": {
        "type": "array"
      },
      "clarification_question": {
        "type": [
          "string",
          "null"
        ]
      }
    },
    "required": [
      "summary"
    ]
  },
  "default_max_retries": 1
}