<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冒泡排序算法可视化演示</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-muted);
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            background: var(--surface);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .visualizer-container {
            height: 400px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 8px;
            padding: 2rem;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 16px;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .bar {
            width: 40px;
            background: var(--primary);
            border-radius: 4px 4px 0 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            justify-content: center;
        }

        .bar-value {
            position: absolute;
            top: -25px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        select {
            padding: 0.75rem 1rem;
            background: var(--bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            border-radius: 12px;
            outline: none;
            cursor: pointer;
        }

        .status-panel {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            border-left: 4px solid var(--primary);
        }

        .status-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .status-text {
            font-weight: 500;
        }

        /* 状态颜色 */
        .comparing { background: var(--warning) !important; }
        .swapping { background: var(--danger) !important; }
        .sorted { background: var(--success) !important; }

    </style>
</head>
<body>

    <header>
        <h1>冒泡排序算法可视化</h1>
        <p>通过交互式动画理解 Bubble Sort 的每一步逻辑</p>
    </header>

    <div class="main-container">
        <div class="visualizer-container" id="visualizer">
            <!-- 柱状图将在这里通过 JS 生成 -->
            <div style="color: var(--text-muted); font-style: italic;">等待初始化...</div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="startBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                开始排序
            </button>
            <button class="btn-outline" id="pauseBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                暂停
            </button>
            <button class="btn-outline" id="resetBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                重置数组
            </button>
            
            <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 0.85rem; color: var(--text-muted);">演示速度</span>
                <select id="speedSelect">
                    <option value="1000">较慢</option>
                    <option value="500" selected>正常</option>
                    <option value="200">较快</option>
                    <option value="50">极快</option>
                </select>
            </div>
        </div>

        <div class="status-panel">
            <div class="status-title">当前状态</div>
            <div class="status-text" id="statusMessage">就绪。点击“重置数组”生成新数据，或点击“开始排序”。</div>
        </div>
    </div>

    <script>
        // 注意：具体的排序引擎、渲染逻辑和动画调度将在后续任务中通过外部 JS 或补全脚本实现
        console.log("静态结构已加载。");
    </script>
</body>
</html>
