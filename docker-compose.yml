services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - REAL_CLI=false
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - BACKEND_API_BASE=http://backend:9000
      - NEXT_PUBLIC_WS_BASE=ws://localhost:9000
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
