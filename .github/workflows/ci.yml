name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff check
        # Phase 5: hard gate (baseline is 0; new code cannot introduce violations).
        run: ruff check .

      - name: Ruff format check
        # Phase 1: baseline informational. Phase 5 turn into a hard gate.
        run: ruff format --check . || true

      - name: Mypy (baseline)
        # Phase 1: mypy is informational. Phase 5 burn-down turns it into
        # a hard gate. continue-on-error so a non-zero baseline doesn't
        # block every PR.
        run: mypy app || true

      - name: Run tests
        run: pytest

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        # Phase 1: baseline informational. Phase 5 turn into a hard gate.
        run: npx prettier --check 'src/**/*.{ts,tsx}' || true

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint
